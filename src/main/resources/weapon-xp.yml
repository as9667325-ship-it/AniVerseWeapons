      reward: "Bonus Stats +10%"
      particles: true
      broadcast: true
    50:
      reward: "Unlock Ultimate Ability"
      particles: true
      broadcast: true
    75:
      reward: "Bonus Stats +20%"
      particles: true
      broadcast: true
    100:
      reward: "Weapon Transcendence"
      particles: true
      broadcast: true